name: archive-to-google-sheets

on:
  schedule:
    - cron: '0 2 1 * *'   # 2 AM on the 1st of every month
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['backend/archive-to-sheets.js']

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install --prefix backend --omit=dev
      - name: Validate environment secrets
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ ERROR: SUPABASE_DATABASE_URL secret is not configured"
            echo "Please add it in Settings → Secrets and variables → Actions"
            exit 1
          fi
          
          # Check if it looks like a valid postgres connection string
          if ! echo "$DATABASE_URL" | grep -qE "postgres(ql)?://.*@.*\.supabase\.co"; then
            echo "❌ WARNING: DATABASE_URL doesn't look like a valid Supabase connection string"
            echo "Expected format: postgres://user:password@db.*.supabase.co:5432/postgres"
          else
            echo "✓ DATABASE_URL appears to be valid"
          fi
      - name: Diagnose network connectivity
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set +e  # Don't exit on errors
          
          echo "=== Extracting hostname ==="
          HOST=$(node -e "console.log(new URL(process.env.DATABASE_URL).hostname)" 2>&1)
          echo "Extracted host: $HOST"
          
          echo -e "\n=== DNS Resolution Tests ==="
          echo "1. Using nslookup:"
          nslookup $HOST || echo "nslookup FAILED"
          
          echo -e "\n2. Using dig:"
          dig $HOST +short || echo "dig FAILED"
          
          echo -e "\n3. Using host:"
          host $HOST || echo "host FAILED"
          
          echo -e "\n4. Checking resolver configuration:"
          cat /etc/resolv.conf
          
          echo -e "\n=== Connectivity Tests ==="
          echo "5. Pinging DNS resolver:"
          ping -c 1 8.8.8.8 || echo "ping FAILED"
          
          set -e  # Re-enable exit on error
      - name: Archive old Supabase data to Google Sheets
        timeout-minutes: 15
        run: node backend/archive-to-sheets.js
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          GAS_KEY: ${{ secrets.GAS_KEY }}
          ARCHIVE_AGE_DAYS: ${{ vars.ARCHIVE_AGE_DAYS || 25 }}
