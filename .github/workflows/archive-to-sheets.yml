name: archive-to-google-sheets

on:
  schedule:
    - cron: '0 2 1 * *'   # 2 AM on the 1st of every month
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['backend/archive-to-sheets.js']

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install --prefix backend --omit=dev
      - name: Verify Supabase connectivity
        timeout-minutes: 2
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: DATABASE_URL secret is not set"
            exit 1
          fi
          HOST=$(node -e "console.log(new URL(process.env.DATABASE_URL).hostname)")
          echo "Testing connection to Supabase host: $HOST"
          for i in {1..3}; do
            if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$HOST/5432"; then
              echo "✓ TCP connection to $HOST:5432 successful"
              break
            else
              if [ $i -lt 3 ]; then
                echo "Connection attempt $i failed, retrying..."
                sleep 2
              else
                echo "WARNING: TCP connection check failed, but proceeding (DNS may still resolve)"
              fi
            fi
          done
      - name: Archive old Supabase data to Google Sheets
        timeout-minutes: 15
        run: node backend/archive-to-sheets.js
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          GAS_KEY: ${{ secrets.GAS_KEY }}
          ARCHIVE_AGE_DAYS: ${{ vars.ARCHIVE_AGE_DAYS || 25 }}
